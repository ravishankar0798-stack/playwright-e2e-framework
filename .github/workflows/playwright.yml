name: Playwright Cucumber Framework

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: "0 2 * * *"   # nightly run

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # ---------------- SMOKE (PR PIPELINE) ----------------
      - name: Run Smoke Tests
        if: github.event_name == 'pull_request'
        run: npx cucumber-js --tags "@smoke" --parallel 2 --format json:reports/cucumber-smoke.json

      # ---------------- REGRESSION (MAIN + NIGHTLY) ----------------
      - name: Run Regression Tests
        if: github.event_name != 'pull_request'
        run: npx cucumber-js --tags "@regression" --parallel 2 --format json:reports/cucumber-regression.json

      # ---------------- RETRY FAILED TESTS ----------------
      - name: Rerun Failed Tests
        if: failure()
        run: npx cucumber-js @rerun.txt --format json:reports/cucumber-rerun.json

      # ---------------- ALLURE REPORT GENERATION ----------------
      - name: Generate Allure Report
        if: always()
        run: |
          npx allure generate reports --clean -o allure-report
          npx allure open allure-report || echo "Allure report generated, skipping open in CI"
          npm install --save-dev allure-commandline

      # ---------------- ARTIFACTS ----------------
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-report
          path: |
            reports/
            allure-report/
          retention-days: 30